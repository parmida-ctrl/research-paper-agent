name: Weekly Research Paper Digest

on:
  schedule:
    # Every Saturday at 7:30 AM ET (11:30 UTC)
    # Offset 30 min from market brief to avoid overlap
    - cron: '30 11 * * 6'

  workflow_dispatch:

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
  REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
  REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper digest agent
        working-directory: src
        run: python agent.py

      - name: Archive digest
        uses: actions/upload-artifact@v4
        with:
          name: paper-digest-${{ github.run_id }}
          path: src/output/*.html
          retention-days: 90
